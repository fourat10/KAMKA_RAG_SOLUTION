version: '3.8'

services:

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: kamka-backend
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env          # loads PINECONE, CLOUDINARY, MONGODB, OPENROUTER keys
    volumes:
      # Persist the HuggingFace model cache so it survives container restarts
      # Without this the 1.3GB BGE model re-downloads every time
      - huggingface_cache:/home/appuser/.cache/huggingface
    restart: unless-stopped
    networks:
      - kamka-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: kamka-frontend
    ports:
      - "3000:3000"
    environment:
      # Points to the backend — use host.docker.internal on Mac/Windows
      # or the service name "backend" on Linux
      - NEXT_PUBLIC_API_URL=http://localhost:8000
      - NODE_ENV=production
    depends_on:
      - backend                 # frontend waits for backend to start
    restart: unless-stopped
    networks:
      - kamka-network

volumes:
  huggingface_cache:            # named volume for the BGE model cache

networks:
  kamka-network:
    driver: bridge